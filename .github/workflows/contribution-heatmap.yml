name: Generate Custom Contribution Heatmap

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build custom heatmap
        env:
          GITHUB_USERNAME: M-Sami-1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          from datetime import date, timedelta, datetime, timezone
          from urllib.request import Request, urlopen
          import json
          import html
          import os
          import pathlib

          username = os.environ["GITHUB_USERNAME"]
          token = os.environ["GITHUB_TOKEN"]
          end = date.today()
          start = end - timedelta(days=364)
          start -= timedelta(days=(start.weekday() + 1) % 7)

          query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """
          payload = {
              "query": query,
              "variables": {
                  "login": username,
                  "from": f"{start.isoformat()}T00:00:00Z",
                  "to": f"{end.isoformat()}T23:59:59Z"
              }
          }
          request = Request(
              "https://api.github.com/graphql",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "GitHub-Contribution-Heatmap",
                  "Accept": "application/vnd.github+json"
              },
              method="POST"
          )
          with urlopen(request, timeout=30) as response:
              result = json.loads(response.read().decode("utf-8"))

          if result.get("errors"):
              messages = "; ".join(error.get("message", "Unknown GraphQL error") for error in result["errors"])
              raise RuntimeError(f"GitHub GraphQL API error: {messages}")

          user = result.get("data", {}).get("user")
          if not user:
              raise RuntimeError(f"GitHub user '{username}' was not returned by the GraphQL API.")

          calendar = user["contributionsCollection"]["contributionCalendar"]
          contribution_days = {}
          for week in calendar["weeks"]:
              for item in week["contributionDays"]:
                  contribution_days[item["date"]] = int(item["contributionCount"])

          days = []
          current = start
          while current <= end:
              count = contribution_days.get(current.isoformat(), 0)
              if count == 0:
                  level = 0
              elif count <= 3:
                  level = 1
              elif count <= 6:
                  level = 2
              elif count <= 9:
                  level = 3
              else:
                  level = 4
              days.append((current, level, count))
              current += timedelta(days=1)

          cell, gap = 11, 3
          step = cell + gap
          left, top = 42, 45
          columns = ((end - start).days // 7) + 1
          width = left + columns * step + 18
          height = 166
          palette = ["#161B22", "#263B50", "#315D7E", "#438BB8", "#79C0FF"]
          total = calendar["totalContributions"]

          parts = [
              f'<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 {width} {height}" role="img" aria-label="GitHub contribution heatmap for {html.escape(username)}">',
              '<style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}.muted{fill:#8B949E}.heading{fill:#E6EDF3;font-size:15px;font-weight:600}.small{font-size:10px}</style>',
              f'<text x="{left}" y="17" class="heading">{total:,} contributions</text>',
              f'<text x="{left}" y="31" class="muted small">{start.strftime("%b %d, %Y")} to {end.strftime("%b %d, %Y")}</text>'
          ]

          month_seen = set()
          for day, _, _ in days:
              if day.day == 1:
                  col = (day - start).days // 7
                  label = day.strftime("%b")
                  if label not in month_seen:
                      parts.append(f'<text x="{left + col * step}" y="42" class="muted small">{label}</text>')
                      month_seen.add(label)

          for label, weekday in [("Mon", 1), ("Wed", 3), ("Fri", 5)]:
              y = top + weekday * step + 8
              parts.append(f'<text x="0" y="{y}" class="muted small">{label}</text>')

          for day, level, count in days:
              col = (day - start).days // 7
              row = (day.weekday() + 1) % 7
              x = left + col * step
              y = top + row * step
              color = palette[level]
              title = html.escape(f"{count} contributions on {day.strftime('%b %d, %Y')}")
              parts.append(f'<rect x="{x}" y="{y}" width="{cell}" height="{cell}" rx="2.5" fill="{color}"><title>{title}</title></rect>')

          legend_y = top + 7 * step + 12
          parts.append(f'<text x="{left}" y="{legend_y}" class="muted small">Less</text>')
          legend_x = left + 31
          for i, color in enumerate(palette):
              parts.append(f'<rect x="{legend_x + i * 15}" y="{legend_y - 9}" width="10" height="10" rx="2" fill="{color}"/>')
          parts.append(f'<text x="{legend_x + 5 * 15 + 3}" y="{legend_y}" class="muted small">More</text>')
          parts.append('</svg>')

          pathlib.Path("dist").mkdir(exist_ok=True)
          pathlib.Path("dist/metrics.svg").write_text("\\n".join(parts), encoding="utf-8")
          print(f"Generated heatmap with {total} contributions across {len(days)} days.")
          PY

      - name: Check out published branch
        uses: actions/checkout@v4
        with:
          ref: output
          path: published
          persist-credentials: true

      - name: Publish heatmap without removing snake
        run: |
          cp dist/metrics.svg published/metrics.svg
          cd published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update custom contribution heatmap"
            git push origin output
          else
            echo "Heatmap is already up to date."
          fi
